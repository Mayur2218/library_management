{% extends "library/base.html" %}
{% load static %}
{% block content %}
        <!-- Product section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="row gx-4 gx-lg-5 align-items-center">
                    <div class="col-md-6">
                        <img src="{{ books.cover.url }}" alt="{{ books.title }}"
                             class="img-fluid rounded shadow"
                             style="width: 100%; height: 600px; display: block;" />
                    </div>
                    <div class="col-md-6">
                        <div class="display-5 fw-bolder mb-1">{{ books.title }}</div>
                        <h5 class="fw-bolder">Author: {{ books.author }}</h5>
                        <div class="fs-5 display-5 fw-bolder mb-1">
                            <span>Price: ₹ {{ books.price }}</span>
                        </div>
                        <p class="lead">{{ books.description }}</p>
                        <div class="d-flex">
                            <input class="form-control text-center me-3" id="inputQuantity" type="num" value="1" style="max-width: 3rem" />
                            <button class="btn btn-outline-dark flex-shrink-0" type="button">
                                <i class="bi-cart-fill me-1"></i>
                                Add to cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
{% endblock %}
